function trLista(x){return x.replace(/\(vencida /g,'(due ').replace(/ e (T\d)/g,' and $1')}
function trRot(r){var m;
 if(m=r.match(/^no pagamento do corte de (\S+) \(enviado à tesouraria\)$/))return 'in the payment run of the '+m[1]+' cut-off (sent to treasury)';
 if(m=r.match(/^na adenda de (\S+)$/))return 'in the addendum of '+m[1];
 if(r==='no próximo pagamento')return 'in the next payment';
 return null;}
function trFrase(p){var m,r;
 if(FIXO[p])return FIXO[p];
 if(m=p.match(/^(.+?) (vai|vão) (.+?) — total ([\d\.]+) MZN$/)){r=trRot(m[3]);if(r)return trLista(m[1])+' '+(m[2]==='vai'?'goes':'go')+' '+r+' — total '+m[4]+' MZN';}
 if(m=p.match(/^(.+?) (retida|retidas) — (.+)$/)){var mo=MOTIVO[m[3]],c;
   if(!mo&&(c=m[3].match(/^contagem validada de (\d+) plantas vivas — sem valor$/)))mo='validated count of '+c[1]+' live plants — no amount';
   if(mo)return trLista(m[1])+' withheld — '+mo;}
 if(m=p.match(/^Reposição de ([\d\.]+) MZN \((.+?), paga antes para conta errada( por erro do projecto)?\) vai (.+)$/)){r=trRot(m[4]);
   if(r)return 'Repayment of '+m[1]+' MZN ('+trLista(m[2])+', previously paid to a wrong account'+(m[3]?' due to a project error':'')+') goes '+r;}
 if(m=p.match(/^Reposição de ([\d\.]+) MZN \((.+?), paga antes para conta errada\) foi carregada para pagamento a (\S+) \(folha de reposições do corte de (\S+)\)$/))
   return 'Repayment of '+m[1]+' MZN ('+trLista(m[2])+', previously paid to a wrong account) was loaded for payment on '+m[3]+' (repayments sheet of the '+m[4]+' cut-off)';
 if(m=p.match(/^(.+?) foi carregada para pagamento a (\S+) \(folha de reposições do corte de (\S+)\) — total ([\d\.]+) MZN$/))
   return trLista(m[1])+' was loaded for payment on '+m[2]+' (repayments sheet of the '+m[3]+' cut-off) — total '+m[4]+' MZN';
 if(m=p.match(/^(T\d) — prevista (\S+) \(([\d\.]+) MZN\)$/))return m[1]+' — expected '+m[2]+' ('+m[3]+' MZN)';
 if(m=p.match(/^(T\d) — prevista (\S+) \(valor depende da contagem de plantas vivas do M&E\)$/))return m[1]+' — expected '+m[2]+' (amount depends on the M&E live-plant count)';
 if(m=p.match(/^Conta de terceiro — ([^:]+?)(: (.*))?$/)){var rl=m[1].trim().toLowerCase();return 'Third-party account — '+(REL[rl]||m[1])+(m[2]?': '+m[3]:'');}
 return p;}

/* ===== dados no aparelho: cifrados com o código (AES-GCM, chave PBKDF2), válidos 7 dias sem ligação ===== */
var PAC='ii_pacote',VALIDADE_DIAS=7,ITER=310000,A_DESCARREGAR=false;

function chaveDe(cod,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(cod),'PBKDF2',false,['deriveKey']).then(function(k){
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}

function guardarPacote(arr,act,ver){if(!COD||!window.crypto||!crypto.subtle)return Promise.resolve();
 var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),cod=COD;
 return chaveDe(cod,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(arr)))})
 .then(function(ct){if(cod!==COD)return;try{localStorage.setItem(PAC,JSON.stringify({v:2,s:b64(salt),i:b64(iv),c:b64(ct),act:act||'',ver:ver||DADOS_VER||'',sinc:Date.now()}))}catch(e){}}).catch(function(){});}

 if(!window.crypto||!crypto.subtle)return Promise.resolve('sem');
 return chaveDe(cod,unb64(m.s)).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.i)},k,unb64(m.c))})
 .then(function(pt){carregarDados(JSON.parse(new TextDecoder().decode(pt)),m.act,m.ver);return 'ok'},function(){return 'errado'});}
var GZ=(typeof DecompressionStream!=='undefined'&&typeof Response!=='undefined');
function desembrulhar(d){
 if(d.z){return new Response(new Blob([unb64(d.z)]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(function(t){return JSON.parse(t)});}
 return Promise.resolve({cab:d.cab,linhas:d.linhas});}

   if(!(d&&d.ok&&(d.z||d.linhas))){A_DESCARREGAR=false;return;}
   desembrulhar(d).then(function(p){A_DESCARREGAR=false;
     var arr=p.linhas.map(function(r){var o={};p.cab.forEach(function(h,j){o[h]=r[j]});return mapear(o)});
     carregarDados(arr,d.actualizado,d.versao);setOn(true,d.actualizado);guardarPacote(arr,d.actualizado,d.versao);
   }).catch(function(){A_DESCARREGAR=false;GZ=false;});},
  function(){A_DESCARREGAR=false;setOn(false);});}
